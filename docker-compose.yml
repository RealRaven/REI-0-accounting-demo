services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      --port 8001
      --max-model-len 8192
      --gpu-memory-utilization 0.90
    ports:
      - "8001:8001"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./docker/qdrant/config.yaml:/qdrant/config/production.yaml:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rei
      POSTGRES_PASSWORD: rei
      POSTGRES_DB: rei
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    env_file: .env
    environment:
      VLLM_BASE_URL: http://vllm:8001/v1
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+asyncpg://rei:rei@postgres:5432/rei
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    depends_on:
      - qdrant
      - postgres
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  hf_cache:
  qdrant_data:
  pg_data: