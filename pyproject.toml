[project]
name = "rei-0-accounting-demo"
version = "0.1.0"
description = "Local RAG accounting assistant: invoices, banking, tax law, hidden costs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.134.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "httpx>=0.27",
    "qdrant-client>=1.16.0",
    "openai>=3.3.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.32.0",
    "alembic>=1.19.1",
    "pypdf>=6.21.4",
    "pymupdf>=2.0,<3.0",
    "pdfplumber>=0.11.10",
    "pytesseract>=0.3.13",
    "Pillow>=12.3.0",
    "celery>=5.6.0",
    "redis>=7.0.0",
    "structlog>=26.1.0",
    "jinja2>=3.1.6",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0.3",
    "typer>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]