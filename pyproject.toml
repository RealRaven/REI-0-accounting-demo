[project]
name = "rei-0-accounting-demo"
version = "0.1.0"
description = "Local RAG accounting assistant: invoices, banking, tax law, hidden costs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "openai>=1.51",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.13",
    "Pillow>=10.4",
    "celery>=5.4",
    "redis>=5.1",
    "structlog>=24.4",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]